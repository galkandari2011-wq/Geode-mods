name: Build Geode Mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Geode CLI
        uses: geode-sdk/install-geode-cli@main

      - name: Build Mod for iOS
        run: geode build --platform iOS --output .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-ios
          path: build/*.geode
