name: Build Geode Mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Geode SDK
        uses: geode-sdk/action@main
        with:
          geode: v3.0.0

      - name: Build the mod
        run: geode build --platform iOS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-ios
          path: build/*.geode
